version: '3'

vars:
  WAILS_VERSION: v3.0.0-alpha.95
  WAILS_BIN: '{{.ROOT_DIR}}/.go/bin/wails3'

tasks:
  ensure:wails3:
    summary: Installs the pinned Wails 3 CLI for local build tasks
    internal: true
    preconditions:
      - sh: go version
        msg: "Go is required to install wails3. Install Go 1.25+ or enter `nix develop`."
    cmds:
      - |
        if [ -x '{{.WAILS_BIN}}' ] && [ "$('{{.WAILS_BIN}}' version)" = '{{.WAILS_VERSION}}' ]; then
          exit 0
        fi
        mkdir -p '{{.ROOT_DIR}}/.go/bin'
        GOBIN='{{.ROOT_DIR}}/.go/bin' go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}

  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{.BUILD_COMMAND}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
      - task: ensure:wails3
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - '{{.WAILS_BIN}} generate bindings -f ''{{.BUILD_FLAGS}}'' -clean=true -ts'

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    deps:
      - task: ensure:wails3
    cmds:
      - '{{.WAILS_BIN}} update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .'
