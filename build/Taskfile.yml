version: '3'

vars:
  WAILS_VERSION: v3.0.0-alpha.95
  WAILS_BIN: '{{.ROOT_DIR}}/.go/bin/wails3'

tasks:
  ensure:wails3:
    summary: Installs the pinned Wails 3 CLI for local build tasks
    internal: true
    preconditions:
      - sh: go version
        msg: "Go is required to install wails3. Install Go 1.25+ or enter `nix develop`."
    cmds:
      - |
        lock_dir='{{.ROOT_DIR}}/.go/wails-install.lock'
        mkdir -p "$(dirname "$lock_dir")"
        while ! mkdir "$lock_dir" 2>/dev/null; do
          sleep 0.2
        done
        trap 'rmdir "$lock_dir"' EXIT

        current_version=""
        if [ -x '{{.WAILS_BIN}}' ]; then
          current_version="$('{{.WAILS_BIN}}' version 2>&1 || true)"
        fi
        case "$current_version" in
          *'{{.WAILS_VERSION}}'*) exit 0 ;;
        esac

        mkdir -p '{{.ROOT_DIR}}/.go/bin'
        GOBIN='{{.ROOT_DIR}}/.go/bin' go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}

        installed_version="$('{{.WAILS_BIN}}' version 2>&1 || true)"
        case "$installed_version" in
          *'{{.WAILS_VERSION}}'*) exit 0 ;;
        esac

        if [ -n "$installed_version" ]; then
          echo "$installed_version" >&2
        fi
        if [ -z "$installed_version" ]; then
          echo "Installed wails3, but it could not report version {{.WAILS_VERSION}}." >&2
        fi
        exit 1

  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - |
        lock_dir='{{.ROOT_DIR}}/.go/go-mod-tidy.lock'
        node_modules='{{.ROOT_DIR}}/frontend/node_modules'
        hidden_node_modules='{{.ROOT_DIR}}/frontend/.node_modules.go-mod-tidy'

        mkdir -p "$(dirname "$lock_dir")"
        while ! mkdir "$lock_dir" 2>/dev/null; do
          sleep 0.2
        done

        restore_node_modules() {
          if [ -d "$hidden_node_modules" ]; then
            rm -rf "$node_modules"
            mv "$hidden_node_modules" "$node_modules"
          fi
        }

        cleanup() {
          restore_node_modules
          rmdir "$lock_dir"
        }

        trap cleanup EXIT

        if [ -d "$node_modules" ]; then
          rm -rf "$hidden_node_modules"
          mv "$node_modules" "$hidden_node_modules"
        fi

        go mod tidy

  patch:wails:
    summary: Applies Forte's local Wails patches to the module cache
    internal: true
    cmds:
      - |
        lock_dir='{{.ROOT_DIR}}/.go/wails-patch.lock'
        mkdir -p "$(dirname "$lock_dir")"
        while ! mkdir "$lock_dir" 2>/dev/null; do
          sleep 0.2
        done
        trap 'rmdir "$lock_dir"' EXIT

        module_dir="$(go env GOMODCACHE)/github.com/wailsapp/wails/v3@{{.WAILS_VERSION}}"
        test -d "$module_dir"
        chmod -R u+w "$module_dir"

        for patch_file in \
          '{{.ROOT_DIR}}/patches/wails-status-notifier-icon-name.patch' \
          '{{.ROOT_DIR}}/patches/wails-gtk4-transparent-window.patch'
        do
          if patch -p1 -d "$module_dir" --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
            patch -p1 -d "$module_dir" < "$patch_file"
          elif patch -p1 -d "$module_dir" --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
            :
          else
            echo "Failed to apply or verify Wails patch: $patch_file" >&2
            exit 1
          fi
        done

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - |
        lock_dir='{{.ROOT_DIR}}/.go/go-mod-tidy.lock'

        mkdir -p "$(dirname "$lock_dir")"
        while ! mkdir "$lock_dir" 2>/dev/null; do
          sleep 0.2
        done
        trap 'rmdir "$lock_dir"' EXIT

        npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{.BUILD_COMMAND}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
      - task: patch:wails
      - task: ensure:wails3
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - '{{.WAILS_BIN}} generate bindings -f ''{{.BUILD_FLAGS}}'' -clean=true -ts'

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    deps:
      - task: ensure:wails3
    cmds:
      - '{{.WAILS_BIN}} update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .'
